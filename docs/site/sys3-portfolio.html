<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS.3 Architecture Views — foxBMS POSIX</title>
<link rel="stylesheet" href="docs.css">
</head>
<body class="view-shell">

<header class="view-header">
  <a href="index.html">Documentation index</a>
  <h1>SYS.3 Architecture Views</h1>
</header>
<nav class="view-links" aria-label="Architecture and verification views">
  <a target="architecture-view" href="sys3-views/overview.html" aria-current="true">Overview</a>
  <a target="architecture-view" href="sys3-views/wiring-diagram.html">Wiring diagram</a>
  <a target="architecture-view" href="sys3-views/ecu-pin-mapping.html">ECU pin mapping</a>
  <a target="architecture-view" href="sys3-views/state-machine.drawio.svg">State machines</a>
  <a target="architecture-view" href="safety-views/tsr-analysis.html">TSR analysis</a>
  <a target="architecture-view" href="safety-views/gap-register.html">Gap register</a>
  <a target="architecture-view" href="sys4-views/test-cases.html">Test cases (107)</a>
  <a target="architecture-view" href="sys4-views/test-matrix-full.html">Full matrix (1,262)</a>
</nav>

<iframe name="architecture-view" title="Architecture and verification: Overview"></iframe>

<script>
const sourceFolders = {
  'sys3-views': '05-SYS.3-system-architecture',
  'sys4-views': '06-SYS.4-system-integration-test',
  'safety-views': '18-safety',
};
const sourceTree = location.pathname.endsWith('/docs/site/sys3-portfolio.html');
const links = document.querySelectorAll('.view-links a');
const frame = document.querySelector('iframe');
links.forEach(link => {
  if (sourceTree) {
    const [folder, file] = link.getAttribute('href').split('/');
    link.href = `../aspice-cl2/${sourceFolders[folder]}/views/${file}`;
  }
  link.addEventListener('click', () => {
    links.forEach(item => item.removeAttribute('aria-current'));
    link.setAttribute('aria-current', 'true');
    frame.title = `Architecture and verification: ${link.textContent}`;
  });
});
frame.src = links[0].href;
</script>
</body>
</html>
